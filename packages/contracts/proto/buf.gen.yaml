version: v2

# Managed mode - automatically manages go_package options required by Go-based protoc plugins
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/worldmonitor/proto
    - file_option: go_package_prefix
      module: buf.build/bufbuild/protovalidate
      value: ""
    # sebuf protos are now vendored locally (no BSR module override needed)

plugins:
  - local: protoc-gen-ts-client
    out: ../generated/client
    opt:
      - paths=source_relative

  - local: protoc-gen-ts-server
    out: ../generated/server
    opt:
      - paths=source_relative

  - local: protoc-gen-openapiv3
    out: ../openapi

  - local: protoc-gen-openapiv3
    out: ../openapi
    opt:
      - format=json

  # Unified bundle spanning all WorldMonitor services (sebuf >= 0.11.0).
  # Emits packages/contracts/openapi/worldmonitor.openapi.yaml alongside the per-service files.
  - local: protoc-gen-openapiv3
    out: ../openapi
    strategy: all
    opt:
      - bundle=true
      - bundle_only=true
      - bundle_output=worldmonitor.openapi.yaml
      - bundle_title=WorldMonitor API
      - bundle_version=1.0.0
      - "bundle_description=Unified OpenAPI bundle spanning all WorldMonitor services. Versioning and deprecation policy: https://www.worldmonitor.app/api-versioning.md (HTML: https://www.worldmonitor.app/docs/api-versioning)"
      - bundle_server=https://api.worldmonitor.app
      - bundle_contact_name=WorldMonitor
      - bundle_contact_email=support@worldmonitor.app
