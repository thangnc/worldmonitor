name: CI

# The pull-request gate for the Lite product (refactor Phase 1b). It replaces
# the upstream Test, Typecheck and Lint Code workflows and their deploy gate:
# one workflow, every job on every PR, no path filters, so a red check always
# means a real failure. Proto Generation Check and Security Audit stay separate.

on:
  pull_request:
  push:
    branches: [main, refactor/lite-monorepo]

# A superseded PR run owes nobody a verdict; a push run keeps its own group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: typecheck and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/install-root-deps
      - run: npm run typecheck
      - run: npm run typecheck:api
      - run: npm run typecheck:contract-tests
      - run: npm run typecheck:dom-tests
      - run: npm run lint
      - run: npm run lint:boundaries
      - run: npm run lint:unicode
      - run: npm run lint:api-contract
      - run: npm run lint:rate-limit-policies
      - run: npm run lint:premium-fetch
      - run: npm run lint:safe-local-storage
      - run: npm run lint:public-docs
      - run: npm run lint:mintlify-slugs
      - run: npm run lint:md
      - run: npm run security:vite-env-secrets
      - run: npm run sync:bootstrap-tier-keys:check
      - run: npm run docs:check
      - run: npm run sources:check

  unit:
    name: unit (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # Redis for the archive Lua suite. Before install-root-deps: both composite
      # actions use actions/cache, and running them side by side has failed.
      - uses: ./.github/actions/install-redis
      - uses: ./.github/actions/install-root-deps
      # scripts/ has its own lockfile; the seeder link check imports from it.
      - run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund
      # WM_EXPECT_BUILT_OUTPUT makes a suite that needs dist/ fail instead of
      # skipping when it lands in a shard by mistake.
      - run: npm run test:data -- --built-output=exclude --shard=${{ matrix.shard }}/3 --concurrency=4
        env:
          WM_EXPECT_BUILT_OUTPUT: '1'
          WM_EXPECT_SCRIPTS_DEPS: '1'

  build:
    name: build and built-output tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/install-root-deps
      # The deploy build itself (vercel.json buildCommand), then the suites that
      # read its output.
      - run: npm run build
      - run: WM_EXPECT_BUILT_OUTPUT=1 npm run test:data -- --built-output=only --concurrency=4
      - name: Edge function bundle check
        run: node scripts/check-edge-function-bundles.mjs --caller=ci
      - name: Derived files are current
        run: npm run generate:check

  health-probe-cutovers:
    name: health-probe cutovers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # The gate diffs this tree against the base it was merged onto.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/install-root-deps
      - name: Enforce health-probe cutovers
        env:
          # Not the PR event's pinned base SHA: GitHub fixes that when the PR
          # opens, while checkout builds the PR merged onto the base's current
          # tip. The merge commit's first parent is that tip (#7021).
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            if git rev-parse --verify --quiet HEAD^2 >/dev/null 2>&1; then
              base="$(git rev-parse HEAD^1)"
            else
              # Unmergeable PR: checkout fell back to the head commit.
              base="origin/$BASE_REF"
            fi
          else
            base="$PUSH_BEFORE"
          fi
          echo "health-probe cutover base: $base"
          node --import tsx scripts/check-health-probe-cutovers.mts "$base"

  dom:
    name: DOM tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/install-root-deps
      - run: npm run test:dom

  server:
    name: server and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: ./.github/actions/install-root-deps
      - run: npm run test:convex
      - run: npm run test:sidecar

  # Services that still live in this repository but outside the Lite web app.
  # Each keeps its upstream gate until 1c or Phase 2 decides its fate.
  consumer-prices:
    name: consumer-prices-core tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: consumer-prices-core/package-lock.json
      - uses: ./.github/actions/install-redis
      - run: npm ci --prefix consumer-prices-core
      - run: npm test --prefix consumer-prices-core

  zapier:
    name: Zapier integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: integrations/zapier/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

  umami-postgres:
    name: Umami Postgres integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_DB: umami_integration
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=postgres --dbname=umami_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Build managed Umami images
        run: |
          docker build --file Dockerfile.umami --tag worldmonitor/umami:ci .
          docker build --file Dockerfile.umami-retention --tag worldmonitor/umami-retention:ci .
      - name: Exercise Umami migration and concurrent upserts
        env:
          UMAMI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/umami_integration
        run: node tests/umami-postgres-integration.mjs
      - name: Probe the running image's write path (identify, concurrent upsert, event)
        env:
          UMAMI_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/umami_integration
        run: node tests/umami-runtime-write-probe.mjs

  digest-image:
    name: digest-notifications image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # No push. Executes the COPY and install steps that the static import
      # test (tests/dockerfile-digest-notifications-imports.test.mjs) cannot.
      - run: docker build -f Dockerfile.digest-notifications -t wm-digest .
