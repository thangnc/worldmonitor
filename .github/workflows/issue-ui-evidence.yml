name: Issue UI Evidence

# Labels UI reports from outside the maintainer set that arrive without a
# screenshot and asks for one, then clears the label once it is attached.
# The bug report form already refuses an empty screenshot field; this catches
# a field filled with text instead of an image. It never closes an issue.
#
# Runs trusted default-branch code: the checkout pins the default branch, and
# the issue title and body reach the script only through the event payload
# file and the API read, never through shell interpolation.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-ui-evidence-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/check-issue-ui-evidence.mjs
            scripts/lib/main-module.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check the UI report for an attachment
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-issue-ui-evidence.mjs
